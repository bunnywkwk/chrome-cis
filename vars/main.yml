---
# Internal values, not meant to be overridden. User settings are in defaults/main.yml.
# Decisions: docs/design-decisions.md (Dn). Rule data: docs/cis-requirements.md.

chrome_cis_benchmark: "CIS Google Chrome Benchmark v3.0.0"
chrome_cis_supported_os_majors: ["8", "9", "10"]
chrome_cis_supported_arch: x86_64
chrome_cis_channels: [stable, beta, unstable, canary]

# Same repo as Google's own /etc/yum.repos.d/google-chrome.repo; it holds every channel (D9, D10)
chrome_cis_repo_baseurl: https://dl.google.com/linux/chrome/rpm/stable/x86_64
chrome_cis_repo_key_url: https://dl.google.com/linux/linux_signing_key.pub

# Chrome reads every *.json here as mandatory machine policy; the role owns one file (D2)
chrome_cis_policy_dir: /etc/opt/chrome/policies/managed
chrome_cis_policy_file: chrome_cis.json

# Installed google-chrome-* packages as {name: version}, e.g. {"google-chrome-stable": "155.0.8059.39"} (D10)
# Empty dict = Chrome not installed (prelim checks its length); the report prints it as is.
chrome_cis_installed: >-
  {{ ansible_facts['packages'] | default({}) | dict2items | selectattr('key', 'match', '^google-chrome-')
     | map(attribute='value') | map('first') | items2dict(key_name='name', value_name='version') }}

# Not applicable on RHEL (D8): no task; listed in the report so all 118 rules are accounted for
chrome_cis_not_applicable:
  - "1.10 not in Chrome 155 policy list (removed)"
  - "1.19 not in Chrome 155 policy list (removed; was Windows only)"
  - "2.1.1 Google Update setting, not a Chrome policy (Windows/macOS updater)"
  - "2.1.2 Google Update setting, not a Chrome policy (Windows/macOS updater)"
  - "2.3.4 not in Chrome 155 policy list (removed)"
  - "2.3.5 not in Chrome 155 policy list (removed)"
  - "2.3.6 not in Chrome 155 policy list (removed)"
  - "2.7.1 not in Chrome 155 policy list (removed)"
  - "2.8.2 Windows only"
  - "2.9.1 not in Chrome 155 policy list (removed)"
  - "2.10.1 Windows only"
  - "2.23 not in Chrome 155 policy list (removed)"
  - "2.29 not in Chrome 155 policy list (removed)"
  - "2.30 Windows only"
  - "3.6 not in Chrome 155 policy list (removed; was Windows only)"
  - "3.13 Windows only"
