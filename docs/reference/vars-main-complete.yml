---
# Internal values, not meant to be overridden. User settings are in defaults/main.yml.
# Decisions: docs/design-decisions.md (Dn). Rule data: docs/cis-requirements.md.

chrome_cis_benchmark: "CIS Google Chrome Benchmark v3.0.0"
chrome_cis_supported_os_majors: ["8", "9", "10"]
chrome_cis_supported_arch: x86_64
chrome_cis_channels: [stable, beta, unstable, canary]

# Same repo as Google's own /etc/yum.repos.d/google-chrome.repo; it holds every channel (D9, D10)
chrome_cis_repo_baseurl: https://dl.google.com/linux/chrome/rpm/stable/x86_64
chrome_cis_repo_key_url: https://dl.google.com/linux/linux_signing_key.pub

# Chrome reads every *.json here as mandatory machine policy; the role owns one file (D2)
chrome_cis_policy_dir: /etc/opt/chrome/policies/managed
chrome_cis_policy_file: chrome_cis.json

# Installed google-chrome-* packages, e.g. ["google-chrome-stable 155.0.8059.39"] (D10)
chrome_cis_installed: >-
  {{ ansible_facts['packages'] | default({}) | dict2items | selectattr('key', 'match', '^google-chrome-')
     | map(attribute='value') | map('first') | map(attribute='name') | list }}
chrome_cis_installed_versions: >-
  {%- set out = [] -%}
  {%- for name in chrome_cis_installed -%}
  {%-   set _ = out.append(name ~ ' ' ~ ansible_facts['packages'][name][0]['version']) -%}
  {%- endfor -%}
  {{ out }}

# All 118 CIS rules (D3). Entry keys:
#   value     CIS value written as-is       var        site variable holding the value (D6)
#   na        not applicable + reason (D8)  toggle     use another rule's toggle (4.12 -> 4.1.1)
#   companion extra policy of a rule (allowlist next to its blocklist, D6); not counted as a rule
# "Disabled" exception lists are written as [] (D7).
chrome_cis_rules:

  # Section 1: Enforced Defaults
  - {id: "1.1.1", level: 1, policy: AllowCrossOriginAuthPrompt, value: false}
  - {id: "1.2.1", level: 1, policy: SafeBrowsingAllowlistDomains, value: []}
  - {id: "1.2.2", level: 1, policy: SafeBrowsingProtectionLevel, var: chrome_cis_safe_browsing_protection_level}
  - {id: "1.3", level: 1, policy: MediaRouterCastAllowAllIPs, value: false}
  - {id: "1.4", level: 1, policy: BrowserNetworkTimeQueriesEnabled, value: true}
  - {id: "1.5", level: 1, policy: AudioSandboxEnabled, value: true}
  - {id: "1.6", level: 1, policy: PromptForDownloadLocation, value: true}
  - {id: "1.7", level: 1, policy: BackgroundModeEnabled, value: false}
  - {id: "1.8", level: 2, policy: SafeSitesFilterBehavior, value: 1}
  - {id: "1.9", level: 1, policy: ChromeVariations, var: chrome_cis_variations}
  - {id: "1.10", level: 1, na: "not in Chrome 155 policy list (removed)"}
  - {id: "1.11", level: 1, policy: CertificateTransparencyEnforcementDisabledForCas, value: []}
  - {id: "1.12", level: 1, policy: CertificateTransparencyEnforcementDisabledForUrls, value: []}
  - {id: "1.13", level: 1, policy: SavingBrowserHistoryDisabled, value: false}
  - {id: "1.14", level: 1, policy: DNSInterceptionChecksEnabled, value: true}
  - {id: "1.15", level: 1, policy: ComponentUpdatesEnabled, value: true}
  - {id: "1.16", level: 1, policy: GloballyScopeHTTPAuthCacheEnabled, value: false}
  - {id: "1.17", level: 1, policy: EnableOnlineRevocationChecks, value: false}
  - {id: "1.18", level: 1, policy: CommandLineFlagSecurityWarningsEnabled, value: true}
  - {id: "1.19", level: 1, na: "not in Chrome 155 policy list (removed; was Windows only)"}
  - {id: "1.20", level: 1, policy: EnterpriseHardwarePlatformAPIEnabled, value: false}
  - {id: "1.21", level: 1, policy: ForceEphemeralProfiles, value: false}
  - {id: "1.22", level: 1, policy: ImportAutofillFormData, value: false}
  - {id: "1.23", level: 1, policy: ImportHomepage, value: false}
  - {id: "1.24", level: 1, policy: ImportSearchEngine, value: false}
  - {id: "1.25", level: 1, policy: HSTSPolicyBypassList, value: []}
  - {id: "1.26", level: 1, policy: OverrideSecurityRestrictionsOnInsecureOrigin, value: []}
  - {id: "1.27", level: 1, policy: LookalikeWarningAllowlistDomains, value: []}
  - {id: "1.28", level: 1, policy: SuppressUnsupportedOSWarning, value: false}
  - {id: "1.29", level: 1, policy: WebRtcLocalIpsAllowedUrls, value: []}

  # Section 2: Attack Surface Reduction
  - {id: "2.1.1", level: 1, na: "Google Update setting, not a Chrome policy (Windows/macOS updater)"}
  - {id: "2.1.2", level: 1, na: "Google Update setting, not a Chrome policy (Windows/macOS updater)"}
  - {id: "2.2.1", level: 1, policy: DefaultInsecureContentSetting, value: 2}
  - {id: "2.2.2", level: 2, policy: DefaultWebBluetoothGuardSetting, value: 2}
  - {id: "2.2.3", level: 2, policy: DefaultWebUsbGuardSetting, value: 2}
  - {id: "2.2.4", level: 2, policy: DefaultNotificationsSetting, value: 2}
  - {id: "2.2.5", level: 1, policy: PdfLocalFileAccessAllowedForDomains, value: []}
  - {id: "2.3.1", level: 1, policy: BlockExternalExtensions, value: true}
  - {id: "2.3.2", level: 1, policy: ExtensionAllowedTypes, value: ["extension", "hosted_app", "platform_app", "theme"]}
  - {id: "2.3.3", level: 1, policy: ExtensionInstallBlocklist, value: ["*"]}
  - {id: "2.3.3", level: 1, policy: ExtensionInstallAllowlist, var: chrome_cis_extension_allowlist, companion: true}
  - {id: "2.3.4", level: 2, na: "not in Chrome 155 policy list (removed)"}
  - {id: "2.3.5", level: 1, na: "not in Chrome 155 policy list (removed)"}
  - {id: "2.3.6", level: 2, na: "not in Chrome 155 policy list (removed)"}
  - {id: "2.3.7", level: 1, policy: ExtensionUnpublishedAvailability, value: 1}
  - {id: "2.4.1", level: 2, policy: AuthSchemes, value: "ntlm,negotiate"}
  - {id: "2.5.1", level: 2, policy: NativeMessagingBlocklist, value: ["*"]}
  - {id: "2.5.1", level: 2, policy: NativeMessagingAllowlist, var: chrome_cis_native_messaging_allowlist, companion: true}
  - {id: "2.6.1", level: 1, policy: PasswordManagerEnabled, var: chrome_cis_password_manager_enabled}
  - {id: "2.7.1", level: 1, na: "not in Chrome 155 policy list (removed)"}
  - {id: "2.8.1", level: 1, policy: RemoteAccessHostAllowRemoteAccessConnections, var: chrome_cis_remote_access_connections}
  - {id: "2.8.2", level: 1, na: "Windows only"}
  - {id: "2.8.3", level: 1, policy: RemoteAccessHostClientDomainList, var: chrome_cis_remote_access_client_domains}
  - {id: "2.8.4", level: 1, policy: RemoteAccessHostRequireCurtain, value: false}
  - {id: "2.8.5", level: 1, policy: RemoteAccessHostFirewallTraversal, value: false}
  - {id: "2.8.6", level: 1, policy: RemoteAccessHostAllowClientPairing, value: false}
  - {id: "2.8.7", level: 1, policy: RemoteAccessHostAllowRelayedConnection, value: false}
  - {id: "2.9.1", level: 1, na: "not in Chrome 155 policy list (removed)"}
  - {id: "2.10.1", level: 1, na: "Windows only"}
  - {id: "2.11", level: 1, policy: DownloadRestrictions, value: 4}
  - {id: "2.12", level: 2, policy: SSLErrorOverrideAllowed, value: false}
  - {id: "2.13", level: 1, policy: DisableSafeBrowsingProceedAnyway, value: true}
  - {id: "2.14", level: 1, policy: SitePerProcess, value: true}
  - {id: "2.15", level: 2, policy: ForceGoogleSafeSearch, value: true}
  - {id: "2.16", level: 1, policy: RelaunchNotification, value: 2}
  - {id: "2.17", level: 1, policy: ProxyMode, var: chrome_cis_proxy_mode}
  - {id: "2.18", level: 2, policy: RequireOnlineRevocationChecksForLocalAnchors, value: true}
  - {id: "2.19", level: 1, policy: RelaunchNotificationPeriod, value: 86400000}
  - {id: "2.20", level: 1, policy: AllowWebAuthnWithBrokenTlsCerts, value: false}
  - {id: "2.21", level: 1, policy: DomainReliabilityAllowed, value: false}
  - {id: "2.22", level: 1, policy: EncryptedClientHelloEnabled, value: true}
  - {id: "2.23", level: 2, na: "not in Chrome 155 policy list (removed)"}
  - {id: "2.24", level: 1, policy: EnterpriseProfileCreationKeepBrowsingData, value: true}
  - {id: "2.25", level: 1, policy: FileOrDirectoryPickerWithoutGestureAllowedForOrigins, value: []}
  - {id: "2.26", level: 1, policy: GoogleSearchSidePanelEnabled, value: false}
  - {id: "2.27", level: 1, policy: HttpAllowlist, var: chrome_cis_http_allowlist}
  - {id: "2.28", level: 1, policy: HttpsUpgradesEnabled, value: true}
  - {id: "2.29", level: 1, na: "not in Chrome 155 policy list (removed)"}
  - {id: "2.30", level: 1, na: "Windows only"}
  - {id: "2.31", level: 1, policy: StrictMimetypeCheckForWorkerScriptsEnabled, value: true}
  - {id: "2.32", level: 1, policy: RemoteDebuggingAllowed, value: false}

  # Section 3: Privacy
  - {id: "3.1.1", level: 2, policy: DefaultCookiesSetting, value: 4}
  - {id: "3.1.2", level: 1, policy: DefaultGeolocationSetting, value: 2}
  - {id: "3.2.1", level: 1, policy: EnableMediaRouter, value: false}
  - {id: "3.3", level: 1, policy: PaymentMethodQueryEnabled, value: false}
  - {id: "3.4", level: 1, policy: BlockThirdPartyCookies, value: true}
  - {id: "3.5", level: 2, policy: BrowserSignin, value: 0}
  - {id: "3.6", level: 1, na: "not in Chrome 155 policy list (removed; was Windows only)"}
  - {id: "3.7", level: 1, policy: SyncDisabled, value: true}
  - {id: "3.8", level: 1, policy: AlternateErrorPagesEnabled, value: false}
  - {id: "3.9", level: 1, policy: AllowDeletingBrowserHistory, value: false}
  - {id: "3.10", level: 1, policy: NetworkPredictionOptions, value: 2}
  - {id: "3.11", level: 1, policy: SpellCheckServiceEnabled, value: false}
  - {id: "3.12", level: 1, policy: MetricsReportingEnabled, value: false}
  - {id: "3.13", level: 1, na: "Windows only"}
  - {id: "3.14", level: 2, policy: SearchSuggestEnabled, value: false}
  - {id: "3.15", level: 2, policy: TranslateEnabled, value: false}
  - {id: "3.16", level: 1, policy: UrlKeyedAnonymizedDataCollectionEnabled, value: false}

  # Section 4: Data Loss Prevention
  - {id: "4.1.1", level: 2, policy: ScreenCaptureAllowed, value: false}
  - {id: "4.2.1", level: 2, policy: DefaultSerialGuardSetting, value: 2}
  - {id: "4.2.2", level: 2, policy: DefaultSensorsSetting, value: 2}
  - {id: "4.2.3", level: 1, policy: ClipboardAllowedForUrls, var: chrome_cis_clipboard_allowed_urls}
  - {id: "4.2.4", level: 1, policy: ClipboardBlockedForUrls, var: chrome_cis_clipboard_blocked_urls}
  - {id: "4.2.5", level: 1, policy: DefaultClipboardSetting, value: 2}
  - {id: "4.2.6", level: 2, policy: DefaultWindowManagementSetting, value: 2}
  - {id: "4.2.7", level: 2, policy: WindowManagementAllowedForUrls, var: chrome_cis_window_management_allowed_urls}
  - {id: "4.2.8", level: 2, policy: WindowManagementBlockedForUrls, var: chrome_cis_window_management_blocked_urls}
  - {id: "4.3", level: 2, policy: AllowFileSelectionDialogs, value: false}
  - {id: "4.4", level: 2, policy: AudioCaptureAllowed, value: false}
  - {id: "4.5", level: 2, policy: VideoCaptureAllowed, value: false}
  - {id: "4.6", level: 1, policy: UserFeedbackAllowed, value: false}
  - {id: "4.7", level: 2, policy: DnsOverHttpsMode, value: "secure"}
  - {id: "4.8", level: 2, policy: AutofillAddressEnabled, value: false}
  - {id: "4.9", level: 1, policy: AutofillCreditCardEnabled, value: false}
  - {id: "4.10", level: 1, policy: ImportSavedPasswords, value: false}
  - {id: "4.11", level: 1, policy: SyncTypesListDisabled, value: ["passwords"]}
  - {id: "4.12", level: 2, policy: ScreenCaptureAllowed, value: false, toggle: "4.1.1"}  # same policy as 4.1.1

  # Section 5: Forensics
  - {id: "5.1", level: 2, policy: BrowserGuestModeEnabled, value: false}
  - {id: "5.2", level: 2, policy: IncognitoModeAvailability, value: 1}
  - {id: "5.3", level: 1, policy: DiskCacheSize, value: 250609664}

# Status of every entry for this run: applied | off_level | off_toggle | site_unset | na (D4-D8)
chrome_cis_rule_status: >-
  {%- set out = [] -%}
  {%- for r in chrome_cis_rules -%}
  {%-   if r.na is defined -%}
  {%-     set st = 'na' -%}
  {%-     set val = none -%}
  {%-   else -%}
  {%-     set level_on = (r.level == 1 and chrome_cis_level_1) or (r.level == 2 and chrome_cis_level_2) -%}
  {%-     set toggle_on = lookup('ansible.builtin.vars', 'chrome_cis_rule_' ~ ((r.toggle | default(r.id)) | replace('.', '_'))) -%}
  {%-     set val = lookup('ansible.builtin.vars', r.var) if r.var is defined else r.value -%}
  {%-     if not level_on -%}
  {%-       set st = 'off_level' -%}
  {%-     elif not toggle_on -%}
  {%-       set st = 'off_toggle' -%}
  {%-     elif r.var is defined and (val is none or (val is not string and val is iterable and val | length == 0)) -%}
  {%-       set st = 'site_unset' -%}
  {%-     else -%}
  {%-       set st = 'applied' -%}
  {%-     endif -%}
  {%-   endif -%}
  {%-   set _ = out.append({'id': r.id, 'policy': r.policy | default(''), 'value': val, 'status': st,
                           'companion': r.companion | default(false),
                           'label': r.id ~ ' ' ~ (r.policy | default(r.na | default('')))}) -%}
  {%- endfor -%}
  {{ out }}

# The JSON content: policy name -> value for every applied entry (4.1.1 and 4.12 give the same key)
chrome_cis_policies: >-
  {{ chrome_cis_rule_status | selectattr('status', 'eq', 'applied')
     | items2dict(key_name='policy', value_name='value') }}
