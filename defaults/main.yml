---
# chrome_cis: harden Google Chrome on RHEL 8/9/10 to the CIS Google Chrome Benchmark v3.0.0.
# Every variable here can be set in group_vars. Decisions: docs/design-decisions.md (Dn).
# Switches are plain YAML booleans; on the command line use JSON: -e '{"chrome_cis_level_2": true}'.

# Install (D9, D10)
chrome_cis_install: false        # true = import Google's key, add its repo, install google-chrome-<channel>
chrome_cis_channel: stable       # stable, beta, unstable, canary

# Profiles (D4): a Level 1 rule needs chrome_cis_level_1, a Level 2 rule needs chrome_cis_level_2.
# CIS Level 2 = Level 1 + Level 2, so for Level 2 keep both true.
chrome_cis_level_1: true
chrome_cis_level_2: false

# Site values (D6): null or [] = report only; set a value and the role writes the policy.
chrome_cis_safe_browsing_protection_level: null   # 1.2.2: 1 (standard) or 2 (enhanced)
chrome_cis_variations: null                       # 1.9: 0 (all variations, the CIS value)
chrome_cis_password_manager_enabled: null         # 2.6.1: true or false
chrome_cis_remote_access_connections: null        # 2.8.1: true or false (CIS: false)
chrome_cis_remote_access_client_domains: []       # 2.8.3: e.g. ["example.com"]
chrome_cis_proxy_mode: null                       # 2.17: "direct" or "system" (never auto_detect)
chrome_cis_http_allowlist: []                     # 2.27: HTTP-only hosts, e.g. ["intranet.example.com"]
chrome_cis_clipboard_allowed_urls: []             # 4.2.3: e.g. ["https://app.example.com"]
chrome_cis_clipboard_blocked_urls: []             # 4.2.4
chrome_cis_window_management_allowed_urls: []     # 4.2.7 (L2)
chrome_cis_window_management_blocked_urls: []     # 4.2.8 (L2)
# Allowlists for two risky blocklists (only written when the rule is on):
chrome_cis_extension_allowlist: []                # 2.3.3: extension IDs still allowed, e.g. a password manager
chrome_cis_native_messaging_allowlist: []         # 2.5.1: native messaging hosts still allowed

# Rule toggles (D5): one per applicable rule. Not-applicable rules (D8) have none.
# All on = full CIS. WARNING: the rules marked WARNING below break things users rely on (D5,
# docs/user-view.md). Turn off the ones your site can't accept in group_vars, e.g. chrome_cis_rule_4_7: false

