---
- name: "2.3.1 | PATCH | Ensure 'Blocks external extensions from being installed' is set to 'Enabled'"
  when:
    - chrome_cis_level_1
    - chrome_cis_rule_2_3_1
  tags:
    - level1
    - automated
    - patch
    - rule_2.3.1
    - extensions
  ansible.builtin.set_fact:
    chrome_cis_policies: "{{ chrome_cis_policies | combine({'BlockExternalExtensions': true}) }}"

- name: "2.3.2 | PATCH | Ensure 'Configure allowed app/extension types' is set to 'Enabled: extension, hosted_app, platform_app, theme'"
  when:
    - chrome_cis_level_1
    - chrome_cis_rule_2_3_2
  tags:
    - level1
    - automated
    - patch
    - rule_2.3.2
    - extensions
  ansible.builtin.set_fact:
    chrome_cis_policies: "{{ chrome_cis_policies | combine({'ExtensionAllowedTypes': ['extension', 'hosted_app', 'platform_app', 'theme']}) }}"

- name: "2.3.3 | PATCH | Ensure 'Configure extension installation blocklist' is set to 'Enabled: *'"
  when:
    - chrome_cis_level_1
    - chrome_cis_rule_2_3_3
  tags:
    - level1
    - automated
    - patch
    - rule_2.3.3
    - extensions
  ansible.builtin.set_fact:
    chrome_cis_policies: "{{ chrome_cis_policies | combine({'ExtensionInstallBlocklist': ['*']}) }}"

- name: "2.3.3 | PATCH | Ensure 'Configure extension installation blocklist' is set to 'Enabled: *' | ExtensionInstallAllowlist"
  when:
    - chrome_cis_level_1
    - chrome_cis_rule_2_3_3
    - chrome_cis_extension_allowlist | length > 0
  tags:
    - level1
    - automated
    - patch
    - rule_2.3.3
    - extensions
  ansible.builtin.set_fact:
    chrome_cis_policies: "{{ chrome_cis_policies | combine({'ExtensionInstallAllowlist': chrome_cis_extension_allowlist}) }}"

- name: "2.3.7 | PATCH | Ensure 'Control availability of extensions unpublished on the Chrome Web Store' Is Disabled"
  when:
    - chrome_cis_level_1
    - chrome_cis_rule_2_3_7
  tags:
    - level1
    - automated
    - patch
    - rule_2.3.7
    - extensions
  ansible.builtin.set_fact:
    chrome_cis_policies: "{{ chrome_cis_policies | combine({'ExtensionUnpublishedAvailability': 1}) }}"
